name: CRM AI CORE CI

on:
  push:
    branches:
      - main
      - master
      - release-candidate
  pull_request:
    branches:
      - main
      - master
      - release-candidate

jobs:
  ci:
    runs-on: ubuntu-latest


    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key
      MERCADOPAGO_ACCESS_TOKEN: ci-test-mercadopago-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests with coverage
        run: npx vitest run --coverage

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test
